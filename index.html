<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />

    <title>Marte — Perseverance</title>

    <canvas id="scene"></canvas>

      <div><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> conducir</div>

      <div><kbd>T</kbd> control de misión</div>
      <div><kbd>B</kbd> borrar huellas</div>
      <div><kbd>R</kbd> volver al inicio</div>
      <div class="raton">clic en los puntos que brillan · foto real de Percy</div>
      <div class="raton">arrastra para orbitar · rueda para acercar</div>
    </div>

    <script type="module" src="/src/main.js"></script>
